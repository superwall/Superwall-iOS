name: SuperwallKit
options:
  bundleIdentifer: com.superwall

packages:
  Superscript:
    url: https://github.com/superwall/superscript-ios-next
    exactVersion: "1.0.15"

targets:
  SuperwallKit:
    scheme:
      testTargets:
        - name: SuperwallKitTests
          # Serial on purpose. Under parallel testing the suite stalls partway through and never
          # finishes — the generated scheme has carried `parallelizable = "NO"` since 7e87a07,
          # and regenerating it from `parallelizable: true` silently reintroduced the hang. The
          # source of truth now says what the scheme has to say.
          parallelizable: false
      commandLineArguments:
        SUPERWALL_UNIT_TESTS: true
      environmentVariables:
        # Where `DesignReviewSnapshots` writes its PNGs. Off by default — the suite is dormant
        # without it. Tick it in Xcode's scheme editor to render the design-review screens. It
        # has to live on the scheme: a plain `CUSTOMER_CENTER_SNAPSHOT_DIR=... xcodebuild test`
        # never reaches the test process running in the simulator.
        - variable: CUSTOMER_CENTER_SNAPSHOT_DIR
          value: /tmp/customer-center-screens
          isEnabled: false
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: "com.superwall.SuperwallKit"
    info:
      path: SuperwallKit.xcodeproj/SuperwallKit_Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: "$(PRODUCT_NAME)"
        CFBundlePackageType: "FMWK"
        CFBundleShortVersionString: "1.0"
        CFBundleSignature: ????
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSPrincipalClass: ""
    type: framework
    platform: iOS
    deploymentTarget: "13.0"
    sources: [Sources/]
    dependencies:
      - package: Superscript
  SuperwallKitTests:
    scheme: {}
    sources: [Tests/]
    type: bundle.unit-test
    platform: iOS
    dependencies:
      - target: SuperwallKit
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: "com.superwall.SuperwallTests"

    info:
      path: SuperwallKit.xcodeproj/SuperwallTests_Info.plist
      properties:
        CFBundleDevelopmentRegion: en
