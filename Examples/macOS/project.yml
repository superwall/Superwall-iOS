name: SuperwallMacExample
options:
  bundleIdPrefix: com.superwall
  deploymentTarget:
    macOS: "13.0"
packages:
  SuperwallKit:
    path: ../..
targets:
  SuperwallMacExample:
    type: application
    platform: macOS
    sources: [SuperwallMacExample]
    dependencies:
      - package: SuperwallKit
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.superwall.Basic
      INFOPLIST_FILE: SuperwallMacExample/Info.plist
      CODE_SIGN_ENTITLEMENTS: SuperwallMacExample/SuperwallMacExample.entitlements
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: "-"
      SWIFT_VERSION: "5.0"
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"
schemes:
  SuperwallMacExample:
    build:
      targets:
        SuperwallMacExample: all
    run:
      config: Debug
      # Same demo API key as the Basic example, so it shares that example's products.
      storeKitConfiguration: ../Basic/Basic/Superwall_Basic-Products.storekit
