name: Emerge Tools Upload

# Run by the release workflow after a release is published, or by hand.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    env:
      PRODUCT_NAME: SuperwallKit
    steps:
      - name: Git Checkout
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: xcodegen
        uses: xavierLowmiller/xcodegen-action@1c73fa3e8d3a1cedd5956ff99fba78232e14ec9c # 1.1.2

      - name: Build XCFramework
        run: sh make-xcframework.sh $PRODUCT_NAME

      - name: Upload artifact to Emerge
        uses: EmergeTools/emerge-upload-action@6703bedaa4ed7286e262b06f28bf63b974744e04 # v1.1.0
        with:
          build_type: release
          artifact_path: ./${{ env.PRODUCT_NAME }}.xcframework.zip
          emerge_api_key: ${{ secrets.EMERGE_API_KEY }}
