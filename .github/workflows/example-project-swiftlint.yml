name: Example Projects SwiftLint

on:
  push:
    paths:
      - '.github/workflows/example-project-swiftlint.yml'
      - 'Examples/.swiftlint.yml'
      - 'Examples/**/*.swift'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  Example-Projects-SwiftLint:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - name: GitHub Action for SwiftLint
        uses: norio-nomura/action-swiftlint@9f4dcd7fd46b4e75d7935cf2f4df406d5cae3684 # 3.2.1
        with:
          args: --config .swiftlint.yml
        env:
          WORKING_DIRECTORY: Examples
