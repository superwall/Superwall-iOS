name: Run Tests

on:
  push:
    # master is tested by the release workflow, which calls this one.
    branches-ignore: [master]
    paths:
      - '.github/workflows/tests.yml'
      - 'project.yml'
      - 'SuperwallKit.podspec'
      - 'scripts/**'
      - '**/*.swift'
      - '!Examples/**'
  workflow_dispatch:
  workflow_call:

# A fixed prefix, not github.workflow: when the release workflow calls this
# one, github.workflow is the caller's name, and sharing its group would
# deadlock.
concurrency:
  group: unit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run-tests:
    runs-on: macos-26

    steps:
      - name: Git Checkout
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      # The release workflow reads the version this way; fail here, not at release time.
      - name: Check the version
        run: scripts/sdk-version.sh --check
      - name: Select Xcode
        # macos-26 runners ship multiple Xcodes but `xcodebuild` defaults
        # to whatever the runner image picked at provision time, which
        # lags behind the latest installed version. The SK2 billing-plan
        # work needs the iOS 26.4 SDK (`Product.SubscriptionInfo.PricingTerms`),
        # so pin to the latest stable Xcode the runner has available.
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - name: xcodegen
        uses: xavierLowmiller/xcodegen-action@0e613a1e117f20e244b21bf6b70c6f579d05fbdd # 1.2.3
      - name: Run Tests
        run: |
          xcodebuild -project SuperwallKit.xcodeproj -scheme SuperwallKit -sdk iphonesimulator -destination 'platform=iOS Simulator,OS=latest,name=iPhone 17 Pro' -derivedDataPath .build test
      # Whether a permission API name reaches the shipped binary is invisible to the
      # test suite — it depends on what the compiler emits, not on what the code
      # returns. Scan the binary the tests just built.
      - name: Scan for privacy API signatures
        run: |
          ./scripts/scan-privacy-signatures.sh .build/Build/Products/Debug-iphonesimulator/SuperwallKit.framework/SuperwallKit
