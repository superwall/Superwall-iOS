name: Build Platforms

on:
  push:
    paths:
      - '.github/workflows/build-platforms.yml'
      - 'project.yml'
      - 'Package.swift'
      - '**/*.swift'
      - '!Examples/**'
      - 'Examples/macOS/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - uses: xavierLowmiller/xcodegen-action@0e613a1e117f20e244b21bf6b70c6f579d05fbdd # 1.2.3
      - name: Test native macOS
        run: xcodebuild -project SuperwallKit.xcodeproj -scheme SuperwallKitMac -destination 'platform=macOS' test CODE_SIGNING_ALLOWED=NO
      - name: Build native Mac example
        run: |
          cd Examples/macOS
          xcodegen
          xcodebuild -project SuperwallMacExample.xcodeproj -scheme SuperwallMacExample -destination 'generic/platform=macOS' build CODE_SIGNING_ALLOWED=NO

  build-maccatalyst:
    runs-on: macos-26

    steps:
      - name: Git Checkout
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - name: xcodegen
        uses: xavierLowmiller/xcodegen-action@0e613a1e117f20e244b21bf6b70c6f579d05fbdd # 1.2.3
      - name: Build Mac Catalyst
        run: |
          xcodebuild -project SuperwallKit.xcodeproj -scheme SuperwallKit -destination 'generic/platform=macOS,variant=Mac Catalyst' build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

  build-visionos:
    runs-on: macos-26

    steps:
      - name: Git Checkout
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - name: Install visionOS platform
        # Only downloads when the runner image doesn't already ship the SDK.
        run: |
          xcodebuild -showsdks | grep -q xrsimulator || xcodebuild -downloadPlatform visionOS
      - name: Remove Xcodeproj
        # The xcodegen project only targets iOS; build through Package.swift instead.
        run: |
          rm -r SuperwallKit.xcodeproj
      - name: Build visionOS
        run: |
          xcodebuild -scheme SuperwallKit -destination 'generic/platform=visionOS Simulator' build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

  build-watchos:
    runs-on: macos-26

    steps:
      - name: Git Checkout
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - name: Install watchOS platform
        # Only downloads when the runner image doesn't already ship the SDK.
        run: |
          xcodebuild -showsdks | grep -q watchsimulator || xcodebuild -downloadPlatform watchOS
      - name: Remove Xcodeproj
        # The xcodegen project only targets iOS; build through Package.swift instead.
        run: |
          rm -r SuperwallKit.xcodeproj
      - name: Build watchOS
        run: |
          xcodebuild -scheme SuperwallKit -destination 'generic/platform=watchOS Simulator' build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

  build-tvos:
    runs-on: macos-26

    steps:
      - name: Git Checkout
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - name: Install tvOS platform
        # Only downloads when the runner image doesn't already ship the SDK.
        run: |
          xcodebuild -showsdks | grep -q appletvsimulator || xcodebuild -downloadPlatform tvOS
      - name: Remove Xcodeproj
        # The xcodegen project only targets iOS; build through Package.swift instead.
        run: |
          rm -r SuperwallKit.xcodeproj
      - name: Build tvOS
        run: |
          xcodebuild -scheme SuperwallKit -destination 'generic/platform=tvOS Simulator' build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
