name: 🐛 Bug report
description: Report a bug in SuperwallKit. The more you give us up front, the faster we can find the cause.
title: "[BUG] "
body:
  - type: checkboxes
    id: checklist
    attributes:
      label: New issue checklist
      options:
        - label: I have read the [documentation](https://superwall.com/docs) and this doesn't appear to be expected behavior
          required: true
        - label: I have searched [existing issues](https://github.com/superwall/Superwall-iOS/issues) and this is not a duplicate
          required: true
        - label: I have tried to reproduce the issue in a minimal sample project I can share
          required: false
  - type: input
    id: affected-user
    attributes:
      label: Affected user
      description: >
        A link to a user who hit the bug lets us check their event logs, which is often the
        fastest route to a diagnosis. In the
        [dashboard](https://superwall.com/select-application?pathname=/applications/:app/users/v2),
        open **Users**, search for the app user ID you pass to `Superwall.shared.identify(userId:)`
        (or the `$SuperwallAlias:...` ID from the device logs if you don't identify users),
        open the user, and paste the page URL. If the bug isn't tied to a user (e.g. a build
        error), write "N/A".
      placeholder: https://superwall.com/applications/<appId>/users/v2/<userId>
    validations:
      required: true
  - type: input
    id: occurred-at
    attributes:
      label: When did it happen?
      description: Approximate date and time the bug occurred, including timezone. Helps us correlate server-side logs.
      placeholder: e.g. 2026-08-15 14:30 UTC
  - type: input
    id: sdk-version
    attributes:
      label: SuperwallKit version
      placeholder: e.g. 4.16.3
    validations:
      required: true
  - type: input
    id: previous-sdk-version
    attributes:
      label: Last SDK version that worked
      description: If the bug appeared after updating the SDK, which version were you on before?
      placeholder: e.g. 4.15.4
  - type: input
    id: ios-version
    attributes:
      label: iOS version(s)
      placeholder: e.g. iOS 26.5
    validations:
      required: true
  - type: input
    id: xcode-version
    attributes:
      label: Xcode version
      placeholder: e.g. 26.1
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - Swift Package Manager
        - CocoaPods
        - Other
    validations:
      required: true
  - type: input
    id: devices
    attributes:
      label: Devices/simulators affected
      placeholder: e.g. iPhone 17 Pro, all simulators
  - type: dropdown
    id: repro-example
    attributes:
      label: Reproducible in the example app?
      options:
        - "Yes"
        - "No"
        - Haven't tried
    validations:
      required: true
  - type: textarea
    id: sdk-setup
    attributes:
      label: How is the SDK set up?
      description: |
        Briefly describe your integration — it changes which code paths run:
        - Are you using a `PurchaseController` (e.g. with RevenueCat)? If so, where do you set `Superwall.shared.subscriptionStatus`?
        - How do you present paywalls (`register(placement:)`, `PaywallView`, `getPaywall`)?
        - Do you call `Superwall.shared.identify(userId:)`?
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of the bug, including expected vs. actual behavior. Screenshots and screen recordings help a lot.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Debug logs
      description: Set `options.logging.level = .debug` in `SuperwallOptions` before configuring the SDK, reproduce the bug, and paste the console output covering when it happened. Automatically formatted as code.
      render: shell
  - type: textarea
    id: other
    attributes:
      label: Other information
      description: Stack traces, crash reports, related issues, links, or anything else that gives context.
